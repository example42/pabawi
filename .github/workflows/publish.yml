name: Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: example42/pabawi

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [core, batteries]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Extract release metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=semver,pattern={{version}}
      - name: Build release candidate locally
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: ${{ matrix.profile }}
          load: true
          push: false
          tags: pabawi:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.profile }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.profile }}-${{ matrix.arch }}
      - name: Verify release candidate
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: |
          bash scripts/supply-chain/image-smoke.sh pabawi:candidate ${{ matrix.profile }}
          mkdir -p artifacts
          docker run --rm -i --entrypoint node pabawi:candidate < scripts/supply-chain/dependency-graph.cjs > artifacts/dependencies.json
      - name: Scan release candidate
        run: |
          ignore_file=()
          if [[ "${{ matrix.profile }}" = batteries ]]; then
            ignore_file=(scripts/supply-chain/trivy-batteries-ignore.yaml)
          fi
          bash scripts/supply-chain/scan-image.sh pabawi:candidate artifacts "${ignore_file[@]}"
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ matrix.profile }}-${{ matrix.arch }}
          path: artifacts/*.json
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the verified image to both registries without rebuilding
        id: push
        run: |
          suffix=""
          if [[ "${{ matrix.profile }}" = batteries ]]; then suffix="-batteries"; fi
          architecture_tag="${GITHUB_REF_NAME}${suffix}-${{ matrix.arch }}"
          ghcr_tag="${REGISTRY}/${IMAGE_NAME}:${architecture_tag}"
          dockerhub_tag="${DOCKERHUB_IMAGE}:${architecture_tag}"
          docker tag pabawi:candidate "$ghcr_tag"
          docker tag pabawi:candidate "$dockerhub_tag"
          docker push "$ghcr_tag"
          docker push "$dockerhub_tag"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ghcr_tag")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Attest the verified image
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-manifest:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified architecture images
        run: |
          version="${GITHUB_REF_NAME#v}"
          for image in "${REGISTRY}/${IMAGE_NAME}" "${DOCKERHUB_IMAGE}"; do
            core_tags=(--tag "$image:$version" --tag "$image:sha-${GITHUB_SHA:0:7}")
            batteries_tags=(--tag "$image:batteries-$version" --tag "$image:batteries-sha-${GITHUB_SHA:0:7}")
            if [[ "$version" != *-* ]]; then
              core_tags+=(--tag "$image:${version%.*}" --tag "$image:${version%%.*}" --tag "$image:latest")
              batteries_tags+=(--tag "$image:batteries-${version%.*}" --tag "$image:batteries-${version%%.*}" --tag "$image:batteries")
            fi
            docker buildx imagetools create "${core_tags[@]}" \
              "$image:${GITHUB_REF_NAME}-amd64" "$image:${GITHUB_REF_NAME}-arm64"
            docker buildx imagetools create "${batteries_tags[@]}" \
              "$image:${GITHUB_REF_NAME}-batteries-amd64" "$image:${GITHUB_REF_NAME}-batteries-arm64"
          done

  create-release:
    needs: publish-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \[${VERSION#v}\]/,/^## \[/" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release notes not found in CHANGELOG.md, using default message"
            echo "## Changes" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
