{{- if and .Values.migrations.enabled (eq .Values.database.type "postgres") (not .Values.postgresql.enabled) .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pabawi.migrationServiceAccountName" . }}
  labels:
    {{- include "pabawi.labels" . | nindent 4 }}
  annotations:
    {{- $annotations := deepCopy .Values.serviceAccount.annotations }}
    {{- $_ := set $annotations "helm.sh/hook" "pre-install,pre-upgrade" }}
    {{- $_ := set $annotations "helm.sh/hook-weight" "-10" }}
    {{/* Keep the account available until the later migration Job has finished. */}}
    {{- $_ := set $annotations "helm.sh/hook-delete-policy" "before-hook-creation" }}
    {{- toYaml $annotations | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
